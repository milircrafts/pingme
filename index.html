<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecting to PingMe...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #070c0e;
      color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #16222a;
      border-top: 4px solid #00e5a3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h2 { font-size: 18px; color: #00e5a3; margin-bottom: 8px; letter-spacing: 0.5px; }
    p { font-size: 13px; color: #7a8c99; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>⚡ Connecting to PingMe</h2>
  <p>Loading vehicle contact portal...</p>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const tag = urlParams.get('tag') || 'VP-1001';
    const targetUrl = "https://script.google.com/macros/s/AKfycbzyofMf1H3AVNfXmOAP2NY8f3TZEKb8JnVtVFGq4Hta0IwiTvlEEd7VySzSlJvY4lwS/exec?tag=" + encodeURIComponent(tag);
    window.location.replace(targetUrl);
  </script>
</body>
</html>
