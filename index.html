<!-- Add this modal/box inside your scan.html body where completed screen appears -->
<div id="doneContainer" style="display:none; text-align:center; padding: 30px 20px;">
  <h3 style="color:#22c55e; font-size:20px;">Alert Delivered Successfully!</h3>
  <p style="color:#94a3b8; font-size:14px; margin-top:8px;">The owner has received your notification via WhatsApp.</p>
  
  <!-- Real-Time Owner Reply Box -->
  <div id="ownerReplyBox" style="margin-top:20px; background:#1e293b; border:1px solid #334155; border-radius:10px; padding:16px; text-align:left;">
    <div style="font-size:12px; color:#38bdf8; font-weight:700; margin-bottom:6px;">💬 OWNER RESPONSE:</div>
    <div id="ownerReplyText" style="color:#f8fafc; font-size:15px; font-weight:500;">
      <span style="color:#64748b; font-style:italic;">Waiting for owner to reply on WhatsApp...</span>
    </div>
  </div>

  <div style="margin-top:25px; font-size:12px; color:#64748b;">
    PingMe • One Scan Instant Connection
  </div>
</div>

<script>
  const BACKEND_URL = "https://script.google.com/macros/s/AKfycbx0ayR-0TsegshEBLe8t9VfN8Ml7VLDzu-wfq-162OqrllTmSdZSmYbhaU2GunfX3kl/exec";
  const urlParams = new URLSearchParams(window.location.search);
  const tagId = urlParams.get("id");

  let userCoords = "";
  let photoDataUrl = "";
  let scannerIP = "UNKNOWN";
  let pollInterval = null;

  window.addEventListener("DOMContentLoaded", () => {
    if (!tagId) {
      document.body.innerHTML = "<div style='text-align:center;padding:50px;color:#94a3b8;'><h3>Invalid QR Code</h3></div>";
      return;
    }

    // 1. Fetch Client Public IP Silently for Audit Trail
    fetch("https://api.ipify.org?format=json")
      .then(res => res.json())
      .then(d => { scannerIP = d.ip; })
      .catch(() => { scannerIP = "UNAVAILABLE"; });

    // 2. Prevent Double Scan via Session Storage
    if (sessionStorage.getItem("pingme_submitted_" + tagId) === "true") {
      showCompletedScreen("Notice: You have already notified the owner during this scan. To send another alert, please scan the physical QR tag again.");
      startReplyPolling();
      return;
    }

    // 3. Verify Tag Status
    fetch(`${BACKEND_URL}?id=${tagId}`)
      .then(res => res.json())
      .then(data => {
        if (!data.valid || data.status === "EXPIRED") {
          document.body.innerHTML = "<div style='text-align:center;padding:50px;color:#94a3b8;'><h3>Tag Inactive or Expired</h3><p>This PingMe tag is not active.</p></div>";
        } else if (data.status === "CREDIT_EXHAUSTED") {
          document.body.innerHTML = "<div style='text-align:center;padding:50px;color:#94a3b8;'><h3>Notifications Paused</h3><p>The owner cannot receive automated alerts right now.</p></div>";
        }
      });
  });

  // GPS Snapshot
  function captureLocation() {
    const btn = document.getElementById("locationBtn");
    if (!navigator.geolocation) {
      alert("Geolocation is not supported by your browser.");
      return;
    }
    btn.innerText = "📍 Fetching location...";
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        userCoords = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`;
        btn.innerText = "✅ Location Attached";
        btn.style.background = "#16a34a";
      },
      (err) => {
        btn.innerText = "📍 Add Location (Optional)";
        alert("Location skipped. You can still send the alert.");
      },
      { timeout: 7000 }
    );
  }

  // Form Submit Routine
  function submitAlertForm() {
    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.innerText = "Sending Alert...";

    const payload = {
      id: tagId,
      itemType: document.getElementById("itemTypeSelect") ? document.getElementById("itemTypeSelect").value : "Vehicle",
      reason: document.getElementById("reasonSelect").value,
      notes: document.getElementById("userNotes") ? document.getElementById("userNotes").value : "",
      location: userCoords,
      photo: photoDataUrl,
      ipAddress: scannerIP,
      userAgent: navigator.userAgent
    };

    fetch(BACKEND_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (res.status === "SUCCESS") {
        sessionStorage.setItem("pingme_submitted_" + tagId, "true");
        showCompletedScreen("Message sent to owner successfully!");
        startReplyPolling(); // Start listening for WhatsApp replies
      } else {
        alert("Alert could not be sent: " + res.message);
        submitBtn.disabled = false;
        submitBtn.innerText = "Send Alert";
      }
    })
    .catch(err => {
      alert("Network error. Please try again.");
      submitBtn.disabled = false;
      submitBtn.innerText = "Send Alert";
    });
  }

  function showCompletedScreen(msg) {
    const formBox = document.getElementById("mainFormContainer");
    if (formBox) formBox.style.display = "none";
    const doneBox = document.getElementById("doneContainer");
    doneBox.style.display = "block";
  }

  // Real-Time Polling for WhatsApp Owner Reply
  function startReplyPolling() {
    if (pollInterval) clearInterval(pollInterval);
    pollInterval = setInterval(() => {
      fetch(`${BACKEND_URL}?action=checkReply&id=${tagId}`)
        .then(res => res.json())
        .then(data => {
          if (data.hasReply) {
            document.getElementById("ownerReplyText").innerHTML = `
              <div style="color:#22c55e; font-weight:700; margin-bottom:4px;">Received:</div>
              "${data.message}"
            `;
            clearInterval(pollInterval); // Stop polling once reply is caught
          }
        })
        .catch(() => {});
    }, 3000); // Polls every 3 seconds
  }
</script>
