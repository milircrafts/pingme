<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PingMe - Vehicle Parking Alert</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f3f4f6; color: #1f2937; display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #ffffff; width: 100%; max-width: 440px; padding: 24px; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); align-self: center; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h2 { font-size: 22px; color: #111827; }
    .tag-badge { display: inline-block; background: #e0e7ff; color: #4338ca; font-weight: 700; padding: 4px 12px; border-radius: 20px; margin-top: 6px; font-size: 14px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #374151; }
    select, textarea, input { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
    button { width: 100%; background: #2563eb; color: #ffffff; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    .status-box { margin-top: 20px; padding: 16px; border-radius: 10px; display: none; }
    .waiting { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
    .reply { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }
    .pulse { animation: blink 1.5s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h2>Vehicle Parking Alert</h2>
      <div id="tagBadge" class="tag-badge">Scanning Tag...</div>
    </div>

    <form id="alertForm">
      <div class="form-group">
        <label for="issue">Select Issue</label>
        <select id="issue" required>
          <option value="Wrong Parking / Blocking Way">🚗 Wrong Parking / Blocking Way</option>
          <option value="Vehicle Lights ON">💡 Vehicle Lights ON</option>
          <option value="Flat Tyre">⚠️ Flat Tyre</option>
          <option value="Emergency Contact">🚨 Emergency Contact</option>
        </select>
      </div>

      <div class="form-group">
        <label for="notes">Short Note (Optional)</label>
        <textarea id="notes" rows="2" placeholder="e.g. Blocking gate entry"></textarea>
      </div>

      <button type="button" id="submitBtn" onclick="submitAlert()">Notify Vehicle Owner</button>
    </form>

    <div id="statusContainer" class="status-box"></div>
  </div>

  <script>
    // REPLACE THIS WITH YOUR APPS SCRIPT WEB APP EXEC URL:
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxhwxge-SiViXW3HBaqvLWjTsZyaZEvaU0-tjMeOTHHUsbhXMybIvoffehhgJ2MHEVm/exec";

    const urlParams = new URLSearchParams(window.location.search);
    const tagId = urlParams.get('tag') || 'VP-1001';
    document.getElementById('tagBadge').innerText = "Tag ID: " + tagId;

    const sessionId = 'INC-' + Date.now();
    let pollInterval = null;
    let gpsCoords = 'Location not shared';

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => { gpsCoords = `https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`; },
        err => { console.log('GPS not available'); }
      );
    }

    function submitAlert() {
      const issue = document.getElementById('issue').value;
      const notes = document.getElementById('notes').value;
      const btn = document.getElementById('submitBtn');
      const statusBox = document.getElementById('statusContainer');

      btn.disabled = true;
      btn.innerText = "Dispatching Alert...";

      const payload = {
        action: 'submitIncident',
        sessionId: sessionId,
        tagId: tagId,
        issue: issue,
        notes: notes,
        gps: gpsCoords
      };

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          document.getElementById('alertForm').style.display = 'none';
          statusBox.style.display = 'block';
          statusBox.className = 'status-box waiting';
          statusBox.innerHTML = `
            <h4 style="margin-bottom: 6px;">🔔 Alert Dispatched</h4>
            <p style="font-size: 14px;">The owner has been notified on WhatsApp & Email.</p>
            <p class="pulse" style="font-size: 13px; margin-top: 10px; font-weight: 600;">
              ⏳ Waiting for owner response...
            </p>
          `;
          startPolling();
        } else {
          alert('Error: ' + res.error);
          btn.disabled = false;
          btn.innerText = "Notify Vehicle Owner";
        }
      })
      .catch(err => {
        alert('Network request failed: ' + err);
        btn.disabled = false;
        btn.innerText = "Notify Vehicle Owner";
      });
    }

    function startPolling() {
      pollInterval = setInterval(() => {
        fetch(`${APPS_SCRIPT_URL}?action=checkReply&sessionId=${encodeURIComponent(sessionId)}`)
          .then(res => res.json())
          .then(data => {
            if (data.replied) {
              clearInterval(pollInterval);
              const statusBox = document.getElementById('statusContainer');
              statusBox.className = 'status-box reply';
              statusBox.innerHTML = `
                <h4 style="color: #15803d; margin-bottom: 6px;">💬 Message from Vehicle Owner:</h4>
                <p style="font-size: 16px; font-weight: 700; color: #166534; padding: 10px; background: #dcfce7; border-radius: 8px;">
                  "${data.message}"
                </p>
                <small style="display:block; margin-top: 8px; color: #4b5563;">Status updated live</small>
              `;
            }
          })
          .catch(err => console.log('Polling check error:', err));
      }, 4000);

      setTimeout(() => {
        if (pollInterval) clearInterval(pollInterval);
      }, 180000); // Stop polling after 3 minutes
    }
  </script>
</body>
</html>
