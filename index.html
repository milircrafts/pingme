<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PingMe Smart Tag</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070c0e;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="pingMeFrame" allow="geolocation; clipboard-write"></iframe>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const tag = urlParams.get('tag') || 'VP-1001';
    const appsScriptBase = "https://script.google.com/macros/s/AKfycbyofMf1H3AVNfxMoAP2NY8f3TZEKb8JnVtVFGq4Hta0IwiTvIEed7VySzSIJvY4lwS/exec";

    document.getElementById('pingMeFrame').src = appsScriptBase + "?tag=" + encodeURIComponent(tag);
  </script>
</body>
</html>
